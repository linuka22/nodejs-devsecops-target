name: E2 - Dependency Scan (npm audit)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Dependency scan (npm audit)
        run: npm audit --audit-level=none || true

      - name: Build Docker image
        run: docker build -t devsecops-node:latest .
